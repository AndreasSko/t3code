name: CI changes
description: Decide which CI jobs a change needs. See .github/scripts/ci-changes.cjs.
outputs:
  typecheck:
    value: ${{ steps.detect.outputs.typecheck }}
  build:
    value: ${{ steps.detect.outputs.build }}
  test:
    value: ${{ steps.detect.outputs.test }}
  test_packages:
    value: ${{ steps.detect.outputs.test_packages }}
  test_web:
    value: ${{ steps.detect.outputs.test_web }}
  test_server:
    value: ${{ steps.detect.outputs.test_server }}
  rust:
    value: ${{ steps.detect.outputs.rust }}
  release_smoke:
    value: ${{ steps.detect.outputs.release_smoke }}
  mobile_native:
    value: ${{ steps.detect.outputs.mobile_native }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -uo pipefail

        decide() {
          node .github/scripts/ci-changes.cjs "$@" | tee -a "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"
        }

        fail_open() {
          echo "$* Running every job."
          decide
        }

        count_rows() {
          printf '%s\n' "$1" | grep -c . || true
        }

        # One row per changed file, holding the new path and, for a rename,
        # the path it replaced: renaming a file out of a package changes that
        # package just like editing it.
        row='[.filename, (.previous_filename // empty)] | @tsv'

        if [[ -n "${PR_NUMBER}" ]]; then
          # The PR files endpoint stops at 3000 files and pagination cannot
          # extend it, so cross-check against the count the PR itself reports.
          expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
            || fail_open "Could not read the pull request."
          rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
            || fail_open "Could not resolve changed files."

          listed=$(count_rows "$rows")
          if [[ "$listed" -lt "$expected" ]]; then
            fail_open "GitHub listed only ${listed} of ${expected} changed files."
          fi
          mode=()
        else
          rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
            || fail_open "Could not resolve changed files."

          # The compare endpoint reports at most 300 files and pagination does
          # not extend that list, so a full list may be hiding changes.
          listed=$(count_rows "$rows")
          if [[ "$listed" -ge 300 ]]; then
            fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
          fi
          # main keeps a full run as the backstop for anything the gate misses.
          mode=(--full)
        fi

        tr '\t' '\n' <<< "$rows" > "$RUNNER_TEMP/changed-paths"
        decide --paths "$RUNNER_TEMP/changed-paths" "${mode[@]}"
